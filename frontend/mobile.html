<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>nexus</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#070e18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="nexus">
<style>
  :root{--neon:#22d3ee;--bg:#070e18;--soft:#7fe9f7;--dim:#2a6b82}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--neon);
    font-family:'Cascadia Code',monospace;user-select:none}
  #app{height:100%;display:flex;flex-direction:column;align-items:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  header{padding:18px 64px;text-align:center;width:100%}
  header h1{font-size:18px;letter-spacing:4px;text-shadow:0 0 12px rgba(34,211,238,.6)}
  header .st{font-size:11px;color:var(--dim);letter-spacing:2px;margin-top:4px}
  #node-wrap{flex:1;display:flex;align-items:center;justify-content:center;width:100%;position:relative}
  canvas{width:100%;height:100%;position:absolute;inset:0}
  #state{position:absolute;bottom:12%;font-size:12px;letter-spacing:5px;color:var(--soft);
    border:1px solid var(--dim);padding:5px 16px;background:rgba(7,14,24,.6)}
  #reply{position:absolute;top:3%;left:4%;width:92%;text-align:left;font-size:13px;
    color:var(--soft);line-height:1.5;max-height:46%;overflow-y:auto;
    -webkit-overflow-scrolling:touch;white-space:pre-wrap}
  .msg{margin-bottom:8px;padding:9px 12px;border:1px solid rgba(42,107,130,.4);
    border-radius:12px;background:rgba(7,14,24,.72)}
  .msg.me{color:#eafcff;border-color:rgba(34,211,238,.45);margin-left:14%}
  .msg.wb{color:var(--soft);margin-right:8%}
  .orb-load{position:absolute;bottom:20%;left:50%;transform:translateX(-50%);
    width:56px;height:56px;display:none}
  .orb-load.show{display:block}
  .orb-load i{position:absolute;top:50%;left:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;
    border-radius:50%;background:var(--neon);box-shadow:0 0 6px var(--neon);
    animation:orbwave 1.1s ease-in-out infinite}
  @keyframes orbwave{0%,100%{opacity:.12;transform:translate(var(--tx),var(--ty)) scale(.55)}
    35%{opacity:1;transform:translate(var(--tx),var(--ty)) scale(1.25)}}
  .mut.conv-on{border-color:var(--neon);color:var(--bg);background:var(--neon);
    box-shadow:0 0 18px rgba(34,211,238,.65);animation:pulse 1.4s infinite}
  footer{width:100%;padding:14px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:8px}
  input{flex:1;background:rgba(0,0,0,.4);border:1px solid var(--dim);color:var(--neon);
    font-family:inherit;font-size:16px;padding:12px;outline:none;border-radius:4px}
  button{background:transparent;border:1px solid var(--dim);color:var(--neon);
    font-family:inherit;font-size:14px;padding:12px 16px;border-radius:4px;cursor:pointer}
  #talk{font-size:34px;width:88px;height:88px;border-radius:50%;align-self:center;
    border:2px solid var(--neon);box-shadow:0 0 20px rgba(34,211,238,.4);background:rgba(34,211,238,.06)}
  #talk.on{background:var(--neon);color:var(--bg);animation:pulse .7s infinite}
  @keyframes pulse{50%{opacity:.5}}
  .mini{font-size:11px;color:var(--dim);text-align:center}
  #host{display:none}
  .mut{width:64px;height:64px;border-radius:50%;font-size:13px;align-self:center}
  .mut.on{border-color:#ff5470;color:#ff5470;background:rgba(255,84,112,.12)}
  #reply{user-select:text;-webkit-user-select:text}
  #reply a{color:var(--neon);text-decoration:underline;word-break:break-all}
  header{position:relative}
  #dev-open{position:absolute;left:14px;top:14px;width:40px;height:40px;border-radius:50%;
    background:rgba(34,211,238,.08);border:1px solid var(--dim);color:var(--neon);font-size:20px}
  #unlink-btn{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:50%;
    background:rgba(255,84,112,.08);border:1px solid var(--dim);color:#ff5470;font-size:16px}
  /* hoja de dispositivos */
  #dev-sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow-y:auto}
  #dev-sheet.hidden{display:none}
  .ds-head{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--dim);position:sticky;top:0;background:var(--bg)}
  .ds-head b{flex:1;font-size:15px;letter-spacing:2px;text-shadow:0 0 10px rgba(34,211,238,.5)}
  .ds-head button{background:transparent;border:1px solid var(--dim);color:var(--neon);width:40px;height:40px;
    border-radius:10px;font-size:18px}
  #ds-scan.busy{animation:pulse .8s infinite}
  .ds-count{padding:10px 16px 0;font-size:11px;color:var(--dim);letter-spacing:1px}
  #ds-list{padding:12px}
  .ds-item{border:1px solid var(--dim);border-radius:12px;padding:12px 14px;margin-bottom:10px;
    background:rgba(10,21,36,.6)}
  .ds-item.ctrl{border-color:rgba(34,211,238,.4)}
  .ds-item.info{opacity:.75}
  .ds-top{display:flex;align-items:center;gap:12px}
  .ds-ic{font-size:24px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.35);border:1px solid var(--dim);border-radius:10px;position:relative}
  .ds-dot{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;border:2px solid var(--bg)}
  .ds-dot.on{background:#28e0a8;box-shadow:0 0 7px #28e0a8}.ds-dot.off{background:var(--dim)}
  .ds-meta{flex:1;min-width:0}
  .ds-meta b{display:block;color:#eafcff;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ds-meta span{font-size:11px;color:var(--soft)}
  .ds-meta small{display:block;font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ds-go{color:var(--neon);font-size:18px}
  .ds-ctrls{display:none;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .ds-item.open .ds-ctrls{display:grid}
  .ds-ctrls button{background:rgba(0,0,0,.35);border:1px solid var(--dim);color:var(--soft);
    font-family:inherit;font-size:14px;padding:13px 8px;border-radius:9px}
  .ds-ctrls button:active{background:rgba(34,211,238,.15)}
  .ds-ctrls button.wide{grid-column:1/-1;color:var(--neon)}
  .ds-msg{grid-column:1/-1;font-size:11px;color:var(--soft);text-align:center;min-height:14px}
  .ds-empty{color:var(--dim);text-align:center;padding:40px 20px;font-size:13px}
  .ds-note{margin:8px 16px 0;padding:11px 13px;border:1px solid rgba(255,178,62,.4);
    border-radius:10px;background:rgba(255,178,62,.06);color:var(--soft);font-size:12px;line-height:1.5}
  .ds-note.hidden{display:none}
</style>
</head>
<body>
<div id="app">
  <header>
    <button id="dev-open" title="Dispositivos de casa">⌂</button>
    <button id="unlink-btn" title="Desvincular de este PC">⛓</button>
    <h1>◈ nexus</h1>
    <div class="st" id="conn">conectando…</div>
  </header>
  <div id="node-wrap">
    <canvas id="reactor"></canvas>
    <div id="reply"></div>
    <div id="orb-load" class="orb-load"></div>
    <div id="state">STANDBY</div>
  </div>
  <footer>
    <div class="row" style="justify-content:center;gap:14px">
      <button id="mute-ai" class="mut" title="Silenciar a nexus">🔊 IA</button>
      <button id="talk" title="Hablar">◉</button>
      <button id="conv" class="mut" title="Conversación continua">∞</button>
      <button id="mute-me" class="mut" title="Mutearme">🎙 YO</button>
    </div>
    <div class="row">
      <input id="term" placeholder="escribe una orden…" autocomplete="off">
      <button id="send">▶</button>
    </div>
    <div class="mini" id="hint">Pulsa el círculo para hablar · funciona con tu PC encendido</div>
  </footer>
</div>

<!-- ===== BUSCADOR DE DISPOSITIVOS (tipo «buscar Bluetooth») ===== -->
<div id="dev-sheet" class="hidden">
  <div class="ds-head">
    <button id="ds-close" title="Cerrar">‹</button>
    <b>Dispositivos de casa</b>
    <button id="ds-scan" title="Buscar">◎</button>
  </div>
  <div id="ds-count" class="ds-count"></div>
  <div id="ds-note" class="ds-note hidden"></div>
  <div id="ds-list"></div>
</div>

<span id="host"></span>

<script src="/static/js/reactor.js"></script>
<!-- T18b: el código del móvil vive en /static/js/mobile.js (la CSP de hoy es
     script-src 'self', así que un bloque en línea no se ejecutaría). Sigue
     siendo clásico y sigue yendo DESPUÉS de reactor.js: ese dibuja el canvas. -->
<script src="/static/js/mobile.js"></script>
</body>
</html>
