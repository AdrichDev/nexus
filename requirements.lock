# ============================================================================
#  nexus — requirements.lock  ·  FOTO FIJADA DEL VENV DE DESARROLLO
# ============================================================================
#  QUÉ ES: las versiones EXACTAS que hoy usa el venv de este proyecto
#  (`.venv`, Python 3.12.4, Windows). No sustituye a `requirements.txt`: ese
#  sigue siendo el fichero donde el humano DECLARA rangos (`>=`). Este solo
#  FIJA lo que ya está probado en esta máquina, para que CI y `run.bat`
#  instalen lo mismo.
#
#  CÓMO SE PRODUJO (sin red, sin resolver nada):
#    1. `.venv/Scripts/python.exe -m pip freeze`  → 106 paquetes instalados.
#    2. Cierre transitivo de las dependencias DIRECTAS de `requirements.txt`
#       y `requirements-voice.txt` (+ `pypdf`, `wmi` y `pywin32`, que `run.bat`
#       instala aparte), leyendo los metadatos ya instalados
#       (`importlib.metadata`) y evaluando los marcadores de entorno contra
#       esta plataforma. Nada se instaló ni se consultó a ningún índice.
#    3. Se conservaron los 98 paquetes del cierre, en el MISMO orden y con el
#       MISMO nombre que imprime `pip freeze` (así un diff es literal).
#
#  LO QUE NO ESTÁ, Y POR QUÉ (los 8 paquetes del venv que no necesita la app):
#    playwright, pyee·(E2E del navegador, comentado en requirements.txt)
#    pyinstaller, pyinstaller-hooks-contrib, altgraph, pefile,
#    pywin32-ctypes·(herramientas de empaquetado del .exe)
#    greenlet·(resto de un paquete desinstalado; nada lo importa)
#  `setuptools` SÍ está porque `ctranslate2` lo declara como dependencia.
#
#  SIN HASHES, A PROPÓSITO:
#    Fijar por hash exige una RESOLUCIÓN contra el índice (`pip-compile
#    --generate-hashes`, o descargar y calcular), es decir, red y una foto
#    nueva de dependencias. Eso lo tiene que hacer el dueño DELIBERADAMENTE,
#    no un worker de CI: aquí solo se documenta la foto offline. Además
#    `--require-hashes` obliga a hashes para TODAS las líneas, también las de
#    los marcadores `win32`, que en Linux ni se descargan. Mientras no haya
#    hashes, esto protege contra DERIVA DE VERSIONES, no contra un índice
#    comprometido.
#
#  CÓMO SE USA (cuando el dueño lo acepte):
#    CI:      python -m pip install --no-deps -r requirements.lock
#             (`--no-deps` porque el cierre ya está completo y así no entra
#              nada que no esté fijado)
#    run.bat: .venv\Scripts\python.exe -m pip install --no-deps -r requirements.lock
#  Compatibilidad comprobada con lo declarado: NINGUNA versión fijada queda
#  fuera del rango de `requirements.txt` / `requirements-voice.txt` (0
#  conflictos al generar este fichero). Si un día hay conflicto, es un
#  hallazgo que se reporta, no algo que se «arregle» subiendo el pin.
#
#  MARCADORES: las 7 líneas con `; sys_platform == "win32"` son las únicas
#  que no existen fuera de Windows (pycaw/comtypes/pythonnet/clr_loader
#  son del volumen y la ventana; pywin32/pypiwin32/WMI de los sensores y la
#  voz). En Linux, pip las SALTÉA: el job de pruebas de CI puede instalar este
#  fichero tal cual. Ojo: eso también significa que su versión no se audita
#  en el job de Linux (ver README, «CI: qué cubre y qué no»).
# ============================================================================
