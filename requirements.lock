# ============================================================================
#  nexus — requirements.lock  ·  FOTO FIJADA DEL VENV DE DESARROLLO
#  (con UNA excepción fechada: los 12 pins de seguridad de abajo — lee
#   «EXCEPCIÓN DE SEGURIDAD, FECHADA (T47)» antes de fiarte del título)
# ============================================================================
#  QUÉ ES: las versiones EXACTAS que hoy usa el venv de este proyecto
#  (`.venv`, Python 3.12.4, Windows). No sustituye a `requirements.txt`: ese
#  sigue siendo el fichero donde el humano DECLARA rangos (`>=`). Este solo
#  FIJA lo que ya está probado en esta máquina, para que CI y `run.bat`
#  instalen lo mismo.
#
#  CÓMO SE PRODUJO (sin red, sin resolver nada):
#    1. `.venv/Scripts/python.exe -m pip freeze`  → 106 paquetes instalados.
#    2. Cierre transitivo de las dependencias DIRECTAS de `requirements.txt`
#       y `requirements-voice.txt` (+ `pypdf`, `wmi` y `pywin32`, que `run.bat`
#       instala aparte), leyendo los metadatos ya instalados
#       (`importlib.metadata`) y evaluando los marcadores de entorno contra
#       esta plataforma. Nada se instaló ni se consultó a ningún índice.
#    3. Se conservaron los 98 paquetes del cierre, en el MISMO orden y con el
#       MISMO nombre que imprime `pip freeze` (así un diff es literal).
#
#  LO QUE NO ESTÁ, Y POR QUÉ (los 8 paquetes del venv que no necesita la app):
#    playwright, pyee·(E2E del navegador, comentado en requirements.txt)
#    pyinstaller, pyinstaller-hooks-contrib, altgraph, pefile,
#    pywin32-ctypes·(herramientas de empaquetado del .exe)
#    greenlet·(resto de un paquete desinstalado; nada lo importa)
#  `setuptools` SÍ está porque `ctranslate2` lo declara como dependencia.
#
#  EXCEPCIÓN DE SEGURIDAD, FECHADA (T47, 2026-11-08) — 12 líneas de abajo NO
#  son ya la foto del `.venv`: son la MENOR versión que cierra TODOS los avisos
#  de `pip-audit` sobre esa foto (run de CI 42525331409, job «pip-audit
#  (Python)», ubuntu-24.04, `pip-audit -r requirements.lock` → «Found 115 known
#  vulnerabilities in 11 packages»). Se subió cada paquete lo MÍNIMO que cierra
#  sus avisos; el salto de major se hizo solo cuando era la única salida:
#    aiohttp      3.14.1    → 3.14.4     14 avisos (PYSEC-2026-3545/3546/3547,
#                                         CVE-2026-111063…111066, 111064,
#                                         111065, 111748…111750,
#                                         GHSA-2g87-pp6c-29x5; 3.14.2 y 3.14.3
#                                         dejaban avisos vivos)
#    certifi      2026.6.17 → 2026.10.18 2 avisos (PYSEC-2026-4320)
#    cryptography 49.0.0    → 50.0.0     2 avisos (PYSEC-2026-3552; major nuevo)
#    filelock     3.31.0    → 4.2.1      12 avisos (CVE-2026-112907…112940;
#                                         major nuevo: uno pedía 4.0.9 y el
#                                         resto 4.2.1)
#    multidict    6.7.1     → 6.9.1      1 aviso (PYSEC-2026-4244)
#    oauthlib     3.3.1     → 4.0.1      3 avisos (PYSEC-2026-4114 x2 → 4.0.0,
#                                         CVE-2026-49272 → 4.0.1; major nuevo y
#                                         el mínimo real es 4.0.1, no 4.0.0)
#    pillow       12.3.0    → 13.0.0     39 avisos (PYSEC-2026-4326…4343,
#                                         CVE-2026-112390…112900,
#                                         CVE-2026-96638/96640/96778,
#                                         GHSA-78g4-xqwv-q3g8; major nuevo)
#    pyasn1       0.6.4     → 0.6.5      4 avisos (CVE-2026-119194…119197)
#    pypdf        6.14.2    → 6.21.4     34 avisos (PYSEC-2026-3655/3656,
#                                         3910…3913, 4153…4160, CVE-2026-
#                                         113786…113795, 115572/115580/115585,
#                                         119203…119209; el mínimo real es
#                                         6.21.4, no 6.15.0)
#    setuptools   83.0.0    → 84.1.0     1 aviso (GHSA-xmj3-9gf7-h52w)
#    urllib3      2.7.0     → 2.8.0      3 avisos (PYSEC-2026-4175/4176/4177)
#  Arrastrado por lo anterior (no tenía avisos propios):
#    yarl         1.24.2    → 1.25.1     aiohttp 3.14.4 exige `yarl>=1.25.1`
#  Verificado, no supuesto: en un venv desechable (Python 3.12.4, fuera del
#  repo) con el cierre COMPLETO y los marcadores `win32` incluidos,
#  `pip install -r` + `pip check` quedan limpios, y `pip-audit -r` sobre este
#  mismo fichero dice «No known vulnerabilities found» (0 de 115). Ningún
#  dependiente del cierre pone tope a estos saltos: `requests-oauthlib`
#  `>=3.0.0` acepta oauthlib 4; `huggingface_hub>=3.10.0` y `setuptools>=3.4.0`
#  aceptan filelock 4; `pdfplumber>=12.2.0`, `pypdf>=8.0.0`, `qrcode>=9.1.0` y
#  `pdfminer.six` aceptan pillow 13; `google-auth>=38.0.3`, `oauthlib>=3.0.0`,
#  `pdfminer.six>=36.0.0`, `pypdf>3.0` y `pywebview` aceptan cryptography 50;
#  `requests<3`, `google-auth<3.0.0`, `fsspec` y `yt-dlp<3,>=2.0.2` aceptan
#  urllib3 2.8.0; `pyasn1_modules<0.7.0,>=0.6.1` acepta pyasn1 0.6.5. Los `==`
#  exactos que SÍ existen (mss→pillow 12.1.1, yt-dlp→certifi/urllib3/
#  cryptography) viven en EXTRAS (`tests`, `pin`, `pin-secretstorage`) que este
#  cierre no instala: no son dependencias de ejecución.
#  ⚠ LO QUE ESTO SIGNIFICA: el `.venv` del dueño sigue en las versiones viejas
#  hasta que lo alinee él mismo (nadie instala en el entorno del dueño):
#      .venv\Scripts\python.exe -m pip install --no-deps -r requirements.lock
#
#  SIN HASHES, A PROPÓSITO:
#    Fijar por hash exige una RESOLUCIÓN contra el índice (`pip-compile
#    --generate-hashes`, o descargar y calcular), es decir, red y una foto
#    nueva de dependencias. Eso lo tiene que hacer el dueño DELIBERADAMENTE,
#    no un worker de CI: aquí solo se documenta la foto offline. Además
#    `--require-hashes` obliga a hashes para TODAS las líneas, también las de
#    los marcadores `win32`, que en Linux ni se descargan. Mientras no haya
#    hashes, esto protege contra DERIVA DE VERSIONES, no contra un índice
#    comprometido.
#
#  CÓMO SE USA (cuando el dueño lo acepte):
#    CI:      python -m pip install --no-deps -r requirements.lock
#             (`--no-deps` porque el cierre ya está completo y así no entra
#              nada que no esté fijado)
#    run.bat: .venv\Scripts\python.exe -m pip install --no-deps -r requirements.lock
#  Compatibilidad comprobada con lo declarado: NINGUNA versión fijada queda
#  fuera del rango de `requirements.txt` / `requirements-voice.txt` (0
#  conflictos al generar este fichero). Si un día hay conflicto, es un
#  hallazgo que se reporta, no algo que se «arregle» subiendo el pin.
#
#  MARCADORES: las 7 líneas con `; sys_platform == "win32"` son las únicas
#  que no existen fuera de Windows (pycaw/comtypes/pythonnet/clr_loader
#  son del volumen y la ventana; pywin32/pypiwin32/WMI de los sensores y la
#  voz). En Linux, pip las SALTÉA: el job de pruebas de CI puede instalar este
#  fichero tal cual. Ojo: eso también significa que su versión no se audita
#  en el job de Linux (ver README, «CI: qué cubre y qué no»).
